[workspace]
resolver = "3"
members = ["crates/eguard-core", "crates/eguard-win", "crates/eguard-service", "crates/eguard-agent", "crates/eguard-guard"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
base64 = "0.22"
hmac = "0.12"
# Time zones from the bundled IANA database on every OS, so Windows and the Mac agent agree with the server
jiff = { version = "0.2", default-features = false, features = ["std", "serde", "tzdb-bundle-always"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: numbers parse exactly, so canonical JSON (and so signatures) match the server's bytes
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
# Denied everywhere; allowed only in eguard-win's FFI modules. eguard-core forbids it outright (lib.rs)
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
