[workspace]
resolver = "3"
members = ["crates/eguard-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
base64 = "0.22"
hmac = "0.12"
# Time zones from the bundled IANA database on every OS, so Windows and the Mac agent agree with the server
jiff = { version = "0.2", default-features = false, features = ["std", "serde", "tzdb-bundle-always"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: numbers parse exactly, so canonical JSON (and so signatures) match the server's bytes
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
